{% extends "base.html" %}
{% block title %}New ticket{% endblock %}
{% block body %}
<div class="page-head">
  <div>
    <h1>New ticket</h1>
  </div>
</div>

<form class="form card" method="post" action="/tickets/new">
  <label>
    Customer
    <select name="customer_id" required>
      {% for customer in customers %}
      <option value="{{ customer.id }}">
        {{ customer.company }} — {{ customer.name }}
      </option>
      {% endfor %}
    </select>
  </label>
  <label>
    Subject
    <input name="subject" required placeholder="Short summary" />
  </label>
  <label>
    Message
    <textarea
      name="body"
      required
      placeholder="What is the customer seeing?"
    ></textarea>
  </label>
  <button type="submit">Create ticket</button>
</form>
{% endblock %}
